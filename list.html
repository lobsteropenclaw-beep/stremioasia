    (function () {
      if (window.screen.width) {

            baseWidth: 1366

          setMeta: function (forceFullscreen=false) {
            // console.log(window.orientation)
            var deviceWidth = window.screen.width;
            var params = this.config.minProfile;
            var head = document.getElementsByTagName("head")[0];
            var viewport = document.createElement('meta');
            var metaList = head.getElementsByTagName("meta");
            if (window.orientation !== undefined) {
              deviceWidth = window.orientation == 0 || window.orientation == -180 || window.orientation == 180 ? window.screen.width : window.screen.height
            }
            for (var i = 0; i < metaList.length; ++i) {
              if (metaList[i].name == "viewport") {
                metaList[i].remove();
                break;
              }
            }
            //console.log(window.screen.width,window.screen.height)
            // 如果是全屏，强制用 device-width
            if (forceFullscreen === true) {
              params = "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover";

                ", user-scalable=yes" +
                ", viewport-fit=cover";
            }
            if (deviceWidth >= this.config.max) {
              params = this.config.maxProfile
            }

            viewport.setAttribute("content", params);

        function onFullscreenChange() {
          var nowFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);

          });
